<h1 id="parcialito-1">Parcialito 1</h1>
<h2 id="correcci%C3%B3n-en-clase">Corrección en clase</h2>
<p><strong>Teoría · DCP</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-theme="n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc" lang="C" data-marpit-pagination="2" style="--paginate:true;--theme:n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc;" data-marpit-pagination-total="23">
<h2 id="c%C3%B3mo-se-lee-cada-pregunta">Cómo se lee cada pregunta</h2>
<ul>
<li>Cada pregunta tiene tres afirmaciones: <strong>A</strong>, <strong>B</strong> y <strong>C</strong>.</li>
<li>Las opciones 1 a 3 son una sola afirmación; las opciones 4 a 6, una combinación de dos.</li>
<li>La respuesta correcta es la opción que contiene <strong>todas y solamente</strong> las afirmaciones verdaderas.</li>
</ul>
<blockquote>
<p>Si A y B son verdaderas, marcar solo &quot;A&quot; está mal: le falta B. Si solo A es verdadera, &quot;A y B&quot; también está mal: incluye una falsa.</p>
</blockquote>
<p>Para cada pregunta vamos a ver: <strong>qué afirmaciones son verdaderas, por qué, y cuál es la opción correcta</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-class="compact" data-theme="n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc" lang="C" class="compact" data-marpit-pagination="3" style="--paginate:true;--class:compact;--theme:n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc;" data-marpit-pagination-total="23">
<h2 id="1--algoritmo-programa-responsabilidades-y-complejidad">1 · Algoritmo, programa, responsabilidades y complejidad</h2>
<ul>
<li><strong>A.</strong> Un algoritmo es una secuencia finita, precisa y ordenada de pasos independiente del lenguaje; un programa es su expresión concreta en un lenguaje e incorpora decisiones sobre tipos, entrada/salida, errores, casos límite y recursos.</li>
<li><strong>B.</strong> Un diseño con alta cohesión y bajo acoplamiento busca que cada componente concentre tareas relacionadas, conozca lo mínimo necesario de los demás y mantenga las reglas cerca de los datos que necesitan.</li>
<li><strong>C.</strong> La complejidad esencial surge de las herramientas y decisiones técnicas elegidas (por ejemplo, variables globales o reglas duplicadas), mientras que la complejidad accidental proviene del dominio del problema en sí.</li>
</ul>
<p>1 A · 2 B · 3 C · 4 A y B · 5 B y C · 6 A y C</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-class="dense" data-theme="n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc" lang="C" class="dense" data-marpit-pagination="4" style="--paginate:true;--class:dense;--theme:n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc;" data-marpit-pagination-total="23">
<h2 id="1--respuesta-opci%C3%B3n-4-a-y-b">1 · Respuesta: opción 4 (A y B)</h2>
<table>
<thead>
<tr>
<th></th>
<th></th>
<th>Por qué</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>A</strong></td>
<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></td>
<td>Un <strong>algoritmo</strong> es la estrategia abstracta; un <strong>programa</strong> es una solución situada que resuelve representación de datos, E/S, persistencia, errores, bordes y recursos.</td>
</tr>
<tr>
<td><strong>B</strong></td>
<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></td>
<td><strong>Alta cohesión</strong> = tareas relacionadas juntas; <strong>bajo acoplamiento</strong> = conocer lo mínimo de otros componentes y poner las reglas cerca de los datos.</td>
</tr>
<tr>
<td><strong>C</strong></td>
<td><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/></td>
<td>Están <strong>invertidas</strong>. La complejidad <strong>esencial</strong> viene del problema que hay que resolver; la <strong>accidental</strong> surge de nuestras herramientas, estructuras o decisiones (variables globales, duplicación, <code>null</code> sin control).</td>
</tr>
</tbody>
</table>
<p><strong>Trampa:</strong> C usa los ejemplos exactos de la clase pero invierte las definiciones de Brooks.</p>
<blockquote>
<p>Clase 1 · <em>&quot;El diseño no elimina la complejidad esencial: evita agregar complejidad innecesaria.&quot;</em></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-class="compact" data-theme="n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc" lang="C" class="compact" data-marpit-pagination="5" style="--paginate:true;--class:compact;--theme:n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc;" data-marpit-pagination-total="23">
<h2 id="2--planificar-vs-construir-con-ia">2 · Planificar vs. construir con IA</h2>
<ul>
<li><strong>A.</strong> Al <strong>planificar</strong> con IA, la salida esperada son archivos de código que compilan; al <strong>construir</strong> con IA, la salida esperada son diagramas, alternativas y decisiones de diseño.</li>
<li><strong>B.</strong> Un buen prompt de planificación no pide escribir código todavía, sino pensar el problema, y se estructura en tres partes: <strong>contexto</strong>, <strong>restricciones</strong> y <strong>formato de salida esperado</strong>.</li>
<li><strong>C.</strong> Pedir código a ciegas sin modelar antes delega las decisiones de diseño en la IA: suele producir soluciones que parecen funcionar en el caso feliz, pero fallan en casos límite y son difíciles de explicar o modificar.</li>
</ul>
<p>1 A · 2 B · 3 C · 4 A y B · 5 A y C · 6 B y C</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-class="dense" data-theme="n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc" lang="C" class="dense" data-marpit-pagination="6" style="--paginate:true;--class:dense;--theme:n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc;" data-marpit-pagination-total="23">
<h2 id="2--respuesta-opci%C3%B3n-6-b-y-c">2 · Respuesta: opción 6 (B y C)</h2>
<table>
<thead>
<tr>
<th></th>
<th></th>
<th>Por qué</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>A</strong></td>
<td><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/></td>
<td>Están <strong>invertidos</strong>. Planificar produce <strong>texto, diagramas y decisiones</strong> (vos decidís, la IA propone); construir produce <strong>archivos que compilan</strong> (vos revisás, la IA ejecuta).</td>
</tr>
<tr>
<td><strong>B</strong></td>
<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></td>
<td>Anatomía de un prompt de planificación: <strong>contexto</strong> (qué, para quién, stack), <strong>restricciones</strong> (alcance, sin frameworks pesados, testeable) y <strong>formato de salida</strong> (responsabilidades, alternativas, diagrama).</td>
</tr>
<tr>
<td><strong>C</strong></td>
<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></td>
<td>Sin modelo previo, la IA decide por vos: funciona en la demo pero se rompe en los bordes y cada cambio descoloca otra parte.</td>
</tr>
</tbody>
</table>
<p><strong>Trampa:</strong> A cruza las columnas de la tabla <em>&quot;Planificar con IA / Construir con IA&quot;</em>.</p>
<blockquote>
<p>Clase 2 · <em>&quot;Primero cerrás <strong>qué</strong> vas a construir y <strong>por qué</strong>. Recién después pedís el <strong>cómo</strong>.&quot;</em></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-class="compact" data-theme="n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc" lang="C" class="compact" data-marpit-pagination="7" style="--paginate:true;--class:compact;--theme:n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc;" data-marpit-pagination-total="23">
<h2 id="3--agentes-y-subagentes">3 · Agentes y subagentes</h2>
<ul>
<li><strong>A.</strong> A diferencia de un chat pasivo que solo responde texto, un agente trabaja en un bucle autónomo sobre un objetivo: lee archivos del repositorio, razona, ejecuta herramientas o comandos y vuelve a observar el resultado hasta completar la tarea.</li>
<li><strong>B.</strong> Un subagente comparte exactamente la misma ventana de contexto que el agente principal para que todas las búsquedas e intentos intermedios queden guardados en la conversación principal.</li>
<li><strong>C.</strong> El rol del subagente es tomar las decisiones globales de arquitectura y coordinar el flujo general, mientras que el agente principal se limita a resolver búsquedas acotadas y descartables.</li>
</ul>
<p>1 A · 2 B · 3 C · 4 A y B · 5 B y C · 6 A y C</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-class="dense" data-theme="n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc" lang="C" class="dense" data-marpit-pagination="8" style="--paginate:true;--class:dense;--theme:n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc;" data-marpit-pagination-total="23">
<h2 id="3--respuesta-opci%C3%B3n-1-a">3 · Respuesta: opción 1 (A)</h2>
<table>
<thead>
<tr>
<th></th>
<th></th>
<th>Por qué</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>A</strong></td>
<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></td>
<td>Un <strong>agente</strong> tiene un objetivo, acceso a herramientas (leer/editar archivos, correr comandos, buscar) y trabaja en un bucle: <em>mira → decide → actúa → vuelve a mirar</em>.</td>
</tr>
<tr>
<td><strong>B</strong></td>
<td><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/></td>
<td>Es al revés: el <strong>subagente</strong> tiene un <strong>contexto propio y descartable</strong>, y devuelve solo su <strong>conclusión</strong> justamente para <strong>no llenar de ruido</strong> el contexto principal.</td>
</tr>
<tr>
<td><strong>C</strong></td>
<td><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/></td>
<td>Los roles están invertidos: el <strong>agente principal</strong> coordina la tarea grande y mantiene el hilo general; el <strong>subagente</strong> explora y resuelve una parte específica y acotada.</td>
</tr>
</tbody>
</table>
<p><strong>Trampa:</strong> la opción 4 (A y B), para quien piensa que &quot;compartir todo el contexto&quot; siempre es mejor.</p>
<blockquote>
<p>Clase 2 · <em>&quot;Subagente: contexto propio y descartable; devuelve solo su conclusión, sin llenar el contexto principal de ruido.&quot;</em></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-class="compact" data-theme="n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc" lang="C" class="compact" data-marpit-pagination="9" style="--paginate:true;--class:compact;--theme:n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc;" data-marpit-pagination-total="23">
<h2 id="4--qu%C3%A9-es-tdd-y-el-ciclo-rojo-%E2%86%92-verde-%E2%86%92-refactor">4 · Qué es TDD y el ciclo Rojo → Verde → Refactor</h2>
<ul>
<li><strong>A.</strong> En TDD los tests actúan como un <strong>contrato</strong> o especificación ejecutable: definen qué significa que el código sea correcto antes de escribir la implementación, describiendo el <em>qué</em> y no el <em>cómo</em>.</li>
<li><strong>B.</strong> En el paso <strong>Verde</strong> se escribe el código mínimo y más simple que haga pasar el test, sin anticipar funcionalidad; recién en <strong>Refactor</strong> se mejora la estructura o legibilidad manteniendo los tests en verde.</li>
<li><strong>C.</strong> Si escribís un test nuevo y pasa de entrada sin tocar el código de producción, igual es válido como paso <strong>Rojo</strong> porque demuestra que el contrato ya se cumplía.</li>
</ul>
<p>1 A · 2 B · 3 C · 4 A y C · 5 A y B · 6 B y C</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-class="dense" data-theme="n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc" lang="C" class="dense" data-marpit-pagination="10" style="--paginate:true;--class:dense;--theme:n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc;" data-marpit-pagination-total="23">
<h2 id="4--respuesta-opci%C3%B3n-5-a-y-b">4 · Respuesta: opción 5 (A y B)</h2>
<table>
<thead>
<tr>
<th></th>
<th></th>
<th>Por qué</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>A</strong></td>
<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></td>
<td>Un test es una <strong>especificación ejecutable</strong>: promete qué salida corresponde a cada entrada, no se desactualiza como un documento y define cuándo una funcionalidad está terminada.</td>
</tr>
<tr>
<td><strong>B</strong></td>
<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></td>
<td>En <strong>Verde</strong> se hace lo mínimo para pasar; en <strong>Refactor</strong> se limpian nombres y duplicación sin cambiar el comportamiento y con toda la suite en verde.</td>
</tr>
<tr>
<td><strong>C</strong></td>
<td><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/></td>
<td>Regla de oro de TDD: <em>&quot;Verificá que el test falle por la razón correcta (si nunca fue rojo, no prueba nada).&quot;</em> Si pasa de entrada, no sirve como paso rojo para guiar código nuevo.</td>
</tr>
</tbody>
</table>
<p><strong>Trampa:</strong> C suena tentadora porque &quot;si pasa, mejor&quot;. Pero si nunca falló, ni siquiera sabés si el test está verificando lo que creés.</p>
<blockquote>
<p>Clase 2 · <em>&quot;No escribas código de producción sin un test rojo que lo pida.&quot;</em></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-class="compact" data-theme="n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc" lang="C" class="compact" data-marpit-pagination="11" style="--paginate:true;--class:compact;--theme:n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc;" data-marpit-pagination-total="23">
<h2 id="5--generaci%C3%B3n-de-tests-con-llms">5 · Generación de tests con LLMs</h2>
<ul>
<li><strong>A.</strong> Si le pedís a un LLM <em>&quot;escribí los tests de esta función&quot;</em> sobre código ya implementado, el modelo suele testear lo que el código <strong>hace</strong> en lugar de lo que <strong>debería hacer</strong>, llegando a consagrar bugs existentes como comportamiento esperado.</li>
<li><strong>B.</strong> Si la suite de tests alcanza el 100 % de cobertura de líneas y pasa en verde, queda garantizado que el contrato del dominio y los casos borde e inválidos están bien verificados.</li>
<li><strong>C.</strong> Los valores esperados de un test siempre pueden obtenerse ejecutando primero la función y copiando su salida en el <code>assertEquals</code>, ya que eso asegura que el test sea consistente con el programa.</li>
</ul>
<p>1 A · 2 B · 3 C · 4 A y B · 5 B y C · 6 A y C</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-class="dense" data-theme="n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc" lang="C" class="dense" data-marpit-pagination="12" style="--paginate:true;--class:dense;--theme:n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc;" data-marpit-pagination-total="23">
<h2 id="5--respuesta-opci%C3%B3n-1-a">5 · Respuesta: opción 1 (A)</h2>
<table>
<thead>
<tr>
<th></th>
<th></th>
<th>Por qué</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>A</strong></td>
<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></td>
<td>El LLM no conoce tu intención si solo ve el código: copia la lógica actual en los tests y <strong>consagra el bug</strong>. Por eso primero van el contrato y tus casos (felices, borde, inválidos).</td>
</tr>
<tr>
<td><strong>B</strong></td>
<td><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/></td>
<td><em>&quot;Cobertura alta no es lo mismo que tests buenos: importa qué se verifica.&quot;</em> Podés ejecutar todas las líneas con un caso feliz sin probar un solo borde ni caso inválido.</td>
</tr>
<tr>
<td><strong>C</strong></td>
<td><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/></td>
<td>Es el mismo error que A hecho a mano: los valores esperados deben salir <strong>del contrato</strong>, nunca de &quot;lo que da el código&quot;. Si copiás la salida de una función rota, el test pasa y oculta el defecto.</td>
</tr>
</tbody>
</table>
<p><strong>Trampas:</strong> la opción 4 (A y B) por confundir cobertura con calidad de contrato, y la 6 (A y C) por no ver que C repite el vicio de A.</p>
<blockquote>
<p>Clase 2 · <em>&quot;El criterio sobre qué es correcto es tuyo. La IA ayuda a escribir y ampliar, no a decidir.&quot;</em></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-class="compact" data-theme="n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc" lang="C" class="compact" data-marpit-pagination="13" style="--paginate:true;--class:compact;--theme:n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc;" data-marpit-pagination-total="23">
<h2 id="6--c%C3%B3mo-funcionan-los-llms-y-sus-debilidades-al-generar-c%C3%B3digo">6 · Cómo funcionan los LLMs y sus debilidades al generar código</h2>
<ul>
<li><strong>A.</strong> Como un LLM predice texto plausible sin ejecutar el programa, cuando inventa una función o librería inexistente (alucinación de API) el tono de su respuesta se vuelve dubitativo y advierte que no está seguro.</li>
<li><strong>B.</strong> Tres debilidades típicas del código generado por IA son la <strong>alucinación de APIs</strong> (métodos o paquetes inexistentes u obsoletos), la <strong>sobre-ingeniería</strong> (capas y patrones innecesarios para un problema simple) y el código que <strong>&quot;compila pero no sirve&quot;</strong> (falla en bordes, traga errores o ignora reglas del dominio).</li>
<li><strong>C.</strong> El compilador verifica sintaxis y tipos, pero no que el programa cumpla la especificación; por eso los errores lógicos son silenciosos y requieren tests (especialmente en casos borde e inválidos) para detectarse.</li>
</ul>
<p>1 A · 2 B · 3 C · 4 B y C · 5 A y B · 6 A y C</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-class="dense" data-theme="n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc" lang="C" class="dense" data-marpit-pagination="14" style="--paginate:true;--class:dense;--theme:n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc;" data-marpit-pagination-total="23">
<h2 id="6--respuesta-opci%C3%B3n-4-b-y-c">6 · Respuesta: opción 4 (B y C)</h2>

<th></th>
<th></th>
<th>Por qué</th>

<tr>
<td><strong>A</strong></td>
<td><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/></td>
<td>Al contrario: el modelo <em>&quot;suena igual de seguro cuando acierta que cuando se equivoca&quot;</em>. Plausible ≠ correcto; la confianza del tono no es evidencia.</td>

<tr>
<td><strong>B</strong></td>
<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></td>
<td>Son exactamente las tres fallas típicas vistas en la Clase 3: APIs inventadas (<code>toIntOrZero()</code>), sobre-ingeniería (<code>Strategy</code> + <code>Factory</code> para sumar) y código que compila pero falla en la lógica.</td>

<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></td>
<td>Los errores de compilación y de ejecución avisan; el <strong>error lógico</strong> no tira el programa abajo, da un resultado incorrecto en silencio y solo lo atrapan los tests.</td>
</tr>
</tbody>
</table>
<p><strong>Trampa:</strong> A arranca con una premisa verdadera (<em>&quot;predice texto plausible sin ejecutar&quot;</em>) para hacer pasar una conclusión falsa.</p>
<blockquote>
<p>Clase 3 · <em>&quot;Plausible ≠ correcto. La confianza en el tono no es evidencia.&quot;</em></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-class="compact" data-theme="n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc" lang="C" class="compact" data-marpit-pagination="15" style="--paginate:true;--class:compact;--theme:n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc;" data-marpit-pagination-total="23">
<h2 id="7--depuraci%C3%B3n-y-lectura-de-errores">7 · Depuración y lectura de errores</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">promedio</span><span class="hljs-params">(notas: <span class="hljs-type">List</span>&lt;<span class="hljs-type">Int</span>&gt;)</span></span>: <span class="hljs-built_in">Double</span> {
    <span class="hljs-keyword">try</span> {
        <span class="hljs-keyword">return</span> (notas.sum() / notas.size).toDouble()
    } <span class="hljs-keyword">catch</span> (e: Exception) {
        <span class="hljs-keyword">return</span> <span class="hljs-number">0.0</span>
    }
}
</code></pre>
<ul>
<li><strong>A.</strong> En <code>promedio</code>, <code>notas.sum() / notas.size</code> hace <strong>división entera</strong> (para <code>listOf(7, 8)</code> da <code>7.0</code> en vez de <code>7.5</code>) y el <code>catch</code> <strong>traga el error</strong> de lista vacía devolviendo <code>0.0</code>, un valor engañoso que oculta la falla.</li>
<li><strong>B.</strong> En un stack trace con excepciones encadenadas, la excepción de más arriba es la causa raíz y el último <code>Caused by</code> del final es solo el síntoma superficial.</li>
<li><strong>C.</strong> Al reportar un bug a la IA, conviene pasarle el error o stack trace completo junto con el valor esperado y el obtenido, y pedirle que explique la causa antes de proponer el arreglo mínimo.</li>
</ul>
<p>1 A · 2 B · 3 C · 4 A y B · 5 B y C · 6 A y C</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-class="dense" data-theme="n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc" lang="C" class="dense" data-marpit-pagination="16" style="--paginate:true;--class:dense;--theme:n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc;" data-marpit-pagination-total="23">
<h2 id="7--respuesta-opci%C3%B3n-6-a-y-c">7 · Respuesta: opción 6 (A y C)</h2>
<table>
<thead>
<tr>
<th></th>
<th></th>
<th>Por qué</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>A</strong></td>
<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></td>
<td><code>15 / 2</code> entre <code>Int</code> trunca a <code>7</code> antes de <code>.toDouble()</code> (<code>7.0</code>). Y con <code>emptyList()</code> el <code>catch (e: Exception)</code> oculta la <code>ArithmeticException</code> devolviendo <code>0.0</code> como si fuera un promedio real.</td>
</tr>
<tr>
<td><strong>B</strong></td>
<td><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/></td>
<td>Es al revés: la excepción de arriba es el <strong>síntoma</strong>; el <strong>último <code>Caused by</code></strong> del final es la <strong>causa raíz</strong> (por ejemplo, <code>FileNotFoundException</code>).</td>
</tr>
<tr>
<td><strong>C</strong></td>

<td>Un buen prompt de depuración incluye evidencia completa (código, caso que falla, resultado actual, stack trace) y pide diagnosticar la <strong>causa</strong> antes de tocar código.</td>
</tr>
</tbody>
</table>
<p><strong>Trampa:</strong> la opción 4 (A y B), por leer el <code>Caused by</code> al revés.</p>
<blockquote>
<p>Clase 3 · <em>&quot;La excepción de arriba es un síntoma; el <code>Caused by</code> del final es la raíz.&quot;</em></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-class="compact" data-theme="n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc" lang="C" class="compact" data-marpit-pagination="17" style="--paginate:true;--class:compact;--theme:n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc;" data-marpit-pagination-total="23">
<h2 id="8--modelado-de-datos-data-class-sealed-class-e-invariantes">8 · Modelado de datos: <code>data class</code>, <code>sealed class</code> e invariantes</h2>
<ul>
<li><strong>A.</strong> Una <code>sealed class</code> define una jerarquía abierta a la que cualquier módulo externo puede agregar subtipos libremente, por lo que un <code>when</code> sobre ella siempre obliga a escribir una rama <code>else</code>.</li>
<li><strong>B.</strong> Proteger las <strong>invariantes</strong> en la construcción (por ejemplo, con <code>require</code> dentro de <code>init</code>) evita que circulen objetos inválidos por el programa, y <code>copy</code> también respeta esas invariantes porque vuelve a construir el objeto.</li>
<li><strong>C.</strong> En una <code>data class</code>, Kotlin genera <code>equals</code>, <code>hashCode</code>, <code>toString</code>, <code>copy</code> y <code>componentN</code> tomando únicamente las propiedades declaradas en el <strong>constructor primario</strong>.</li>
</ul>
<p>1 A · 2 B · 3 C · 4 A y B · 5 B y C · 6 A y C</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-class="dense" data-theme="n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc" lang="C" class="dense" data-marpit-pagination="18" style="--paginate:true;--class:dense;--theme:n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc;" data-marpit-pagination-total="23">
<h2 id="8--respuesta-opci%C3%B3n-5-b-y-c">8 · Respuesta: opción 5 (B y C)</h2>
<table>
<thead>
<tr>
<th></th>
<th></th>
<th>Por qué</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>A</strong></td>
<td><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/></td>
<td>Una <code>sealed class</code> es una <strong>jerarquía cerrada</strong>: todas las variantes son conocidas al compilar, por lo que el compilador verifica que el <code>when</code> sea exhaustivo <strong>sin</strong> necesitar un <code>else</code> genérico.</td>
</tr>
<tr>
<td><strong>B</strong></td>
<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></td>
<td>Una invariante es una condición que todo objeto válido debe cumplir. Validar con <code>require</code> en <code>init</code> rechaza entradas inválidas con <code>IllegalArgumentException</code>, incluso al usar <code>copy(...)</code>.</td>
</tr>
<tr>
<td><strong>C</strong></td>
<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></td>
<td>Las operaciones estructurales generadas por <code>data class</code> usan solo las propiedades del constructor principal; las propiedades declaradas en el cuerpo quedan afuera.</td>
</tr>
</tbody>
</table>
<p><strong>Trampa:</strong> A describe el problema de una jerarquía abierta común, justamente lo que <code>sealed class</code> viene a resolver.</p>
<blockquote>
<p>Clase 4 · <em>&quot;Al ser una jerarquía cerrada, el compilador puede verificar que el <code>when</code> cubra todos los casos.&quot;</em></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-class="compact" data-theme="n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc" lang="C" class="compact" data-marpit-pagination="19" style="--paginate:true;--class:compact;--theme:n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc;" data-marpit-pagination-total="23">
<h2 id="9--programaci%C3%B3n-funcional-funciones-puras-e-inmutabilidad">9 · Programación funcional: funciones puras e inmutabilidad</h2>
<ul>
<li><strong>A.</strong> Una función que calcula si un alumno aprueba leyendo la nota mínima desde un archivo de configuración o consultando la fecha actual es <strong>pura</strong>, siempre que no modifique ese archivo ni imprima en consola.</li>
<li><strong>B.</strong> Una <strong>función pura</strong> siempre devuelve el mismo resultado para los mismos argumentos y no produce efectos observables fuera de ella (no muta estado externo, no lee ni escribe archivos, red o consola).</li>
<li><strong>C.</strong> Declarar <code>val xs = mutableListOf(1, 2)</code> garantiza <strong>inmutabilidad profunda</strong>: como se usa <code>val</code>, no es posible agregar ni quitar elementos de la lista.</li>
</ul>
<p>1 A · 2 B · 3 C · 4 A y B · 5 B y C · 6 A y C</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-class="dense" data-theme="n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc" lang="C" class="dense" data-marpit-pagination="20" style="--paginate:true;--class:dense;--theme:n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc;" data-marpit-pagination-total="23">
<h2 id="9--respuesta-opci%C3%B3n-2-b">9 · Respuesta: opción 2 (B)</h2>
<table>
<thead>
<tr>
<th></th>
<th></th>
<th>Por qué</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>A</strong></td>
<td><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/></td>
<td>No alcanza con &quot;no modificar&quot;: si lee un archivo o el reloj, con el <strong>mismo argumento</strong> puede dar <strong>resultados distintos</strong> según el entorno. Viola la primera propiedad de pureza (es exactamente el contraejemplo <code>aprobarHoy</code> de la Clase 4).</td>
</tr>
<tr>
<td><strong>B</strong></td>
<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></td>
<td>Definición de función pura: <strong>1)</strong> mismos argumentos → mismo resultado; <strong>2)</strong> sin efectos observables afuera. Eso permite probarla solo con argumentos y resultados.</td>
</tr>
<tr>
<td><strong>C</strong></td>
<td><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/></td>
<td><code>val</code> solo impide <strong>reasignar la referencia</strong> <code>xs</code>, pero la lista referenciada es mutable (<code>xs.add(3)</code> es válido y cambia su contenido). Tampoco <code>List&lt;T&gt;</code> congela una <code>MutableList</code> subyacente: es solo una interfaz de solo lectura.</td>
</tr>
</tbody>
</table>
<p><strong>Trampas:</strong> la opción 4 (A y B), por creer que &quot;puro = no escribe&quot;, y la 5 (B y C), por confundir <code>val</code> con inmutabilidad del objeto.</p>
<blockquote>
<p>Clase 4 · <em>&quot;La lógica pura se prueba con argumentos y resultados, sin archivos, red ni configuración.&quot;</em></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-class="compact" data-theme="n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc" lang="C" class="compact" data-marpit-pagination="21" style="--paginate:true;--class:compact;--theme:n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc;" data-marpit-pagination-total="23">
<h2 id="10--transformaci%C3%B3n-de-colecciones-map-filter-fold-y-reduce">10 · Transformación de colecciones: <code>map</code>, <code>filter</code>, <code>fold</code> y <code>reduce</code></h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-keyword">val</span> numeros = listOf(<span class="hljs-number">1</span>, <span class="hljs-number">2</span>, <span class="hljs-number">3</span>, <span class="hljs-number">4</span>)
<span class="hljs-keyword">val</span> resultado = numeros.filter { it % <span class="hljs-number">2</span> == <span class="hljs-number">0</span> }.map { it * <span class="hljs-number">10</span> }
</code></pre>
<ul>
<li><strong>A.</strong> <code>filter</code> conserva los elementos que cumplen el predicado sin transformarlos (puede cambiar la cantidad de elementos), mientras que <code>map</code> aplica una función a cada elemento conservando la cantidad; ninguna de las dos modifica la lista original <code>numeros</code>, y <code>resultado</code> vale <code>listOf(20, 40)</code>.</li>
<li><strong>B.</strong> <code>fold</code> y <code>reduce</code> se comportan igual ante una colección vacía: ambos devuelven <code>0</code> (o <code>null</code>) sin lanzar excepción.</li>
<li><strong>C.</strong> <code>fold</code> recibe un valor inicial que define el resultado cuando la colección está vacía y permite que el acumulador sea de otro tipo; <code>reduce</code> no recibe valor inicial, usa el primer elemento y lanza <code>UnsupportedOperationException</code> si la colección está vacía.</li>
</ul>
<p>1 A · 2 B · 3 C · 4 A y B · 5 B y C · 6 A y C</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-class="dense" data-theme="n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc" lang="C" class="dense" data-marpit-pagination="22" style="--paginate:true;--class:dense;--theme:n32uf20sagqm4geqegmiyllpm58ii0orhfd7s4uuqyc;" data-marpit-pagination-total="23">
<h2 id="10--respuesta-opci%C3%B3n-6-a-y-c">10 · Respuesta: opción 6 (A y C)</h2>
<table>
<thead>
<tr>
<th></th>
<th></th>
<th>Por qué</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>A</strong></td>
<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></td>
<td><code>filter</code> selecciona <code>[2, 4]</code>; <code>map</code> transforma cada uno en <code>[20, 40]</code> manteniendo la cantidad de elementos que recibió. Ambas devuelven listas nuevas sin mutar <code>numeros</code>.</td>
</tr>
<tr>
<td><strong>B</strong></td>
<td><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/></td>
<td>Sobre una colección vacía, <code>reduce</code> <strong>no tiene primer elemento</strong> para usar como acumulador y lanza <code>UnsupportedOperationException</code>.</td>
</tr>
<tr>
<td><strong>C</strong></td>
<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></td>
<td><code>fold(inicial)</code> arranca desde <code>inicial</code> (que además es el resultado si la lista está vacía y puede ser de cualquier tipo); <code>reduce</code> exige al menos un elemento por contrato.</td>
</tr>
</tbody>
</table>
<p><strong>Trampa:</strong> la opción 1 (solo A), si no recuerdan la diferencia exacta entre <code>fold</code> y <code>reduce</code> en el caso borde de lista vacía.</p>
<blockquote>
<p>Clase 4 · <em>&quot;Si no podés garantizar que haya elementos, no uses <code>reduce</code> despreocupadamente.&quot;</em></p>
</blockquote>
</section>
